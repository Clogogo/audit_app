name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build & type-check frontend ────────────────────────────────────────────
  check-frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx nx run web:build
        env:
          NX_DAEMON: false
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # ── Install deps & syntax-check backend ───────────────────────────────────
  check-backend:
    name: Backend — checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Syntax check (all .py files)
        run: find apps/api -name "*.py" | xargs python -m py_compile

  # ── Deploy frontend → Vercel ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy → Vercel
    needs: check-frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm install -g vercel
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Deploy backend → Render ────────────────────────────────────────────────
  deploy-backend:
    name: Deploy → Render
    needs: check-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger deploy hook
        id: trigger
        run: |
          RESPONSE=$(curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "$RESPONSE"
          # Hook returns {"deploy":{"id":"dep-..."}} — extract the nested id
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['deploy']['id'])")
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to go live
        env:
          RENDER_API_KEY:    ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          DEPLOY_ID="${{ steps.trigger.outputs.deploy_id }}"

          # Guard: fail fast if required secrets are missing
          if [ -z "$RENDER_API_KEY" ]; then
            echo "ERROR: RENDER_API_KEY secret is not set in GitHub → Settings → Secrets."
            exit 1
          fi
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "ERROR: RENDER_SERVICE_ID secret is not set in GitHub → Settings → Secrets."
            exit 1
          fi

          echo "Polling deploy $DEPLOY_ID on service $RENDER_SERVICE_ID ..."
          for i in $(seq 1 40); do
            # Use -sS (no -f) so error bodies are captured instead of silently discarded
            BODY=$(curl -sS \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")
            echo "  [attempt $i] raw: $BODY"

            # Extract status — handles both {"status":"..."} and {"deploy":{"status":"..."}}
            STATUS=$(echo "$BODY" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    print(d.get('deploy', d).get('status', ''))
except Exception as e:
    print(f'parse_error: {e}', file=sys.stderr)
    print('')
")
            echo "  [attempt $i] status: $STATUS"
            case "$STATUS" in
              live)
                echo "Deploy succeeded."
                exit 0
                ;;
              build_failed|deactivated|canceled)
                echo "Deploy FAILED with status: $STATUS"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out after 10 min waiting for Render deploy."
          exit 1
