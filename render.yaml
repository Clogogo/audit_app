services:
  - type: web
    name: financeaudit-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # Database Configuration
      # Managed Postgres on Neon (https://neon.tech) — reliable and persistent,
      # unlike SQLite on /tmp which is wiped on every restart/redeploy.
      # Set the actual value in the Render dashboard (Environment tab), never
      # commit it here — it contains a live password.
      - key: DATABASE_URL
        sync: false

      # Frontend Configuration
      - key: FRONTEND_URL
        sync: false          # Set to your Vercel URL e.g. https://financeaudit.vercel.app
      
      # API Configuration
      - key: OPENAI_API_KEY
        sync: false          # Required for AI features
      - key: SECRET_KEY
        sync: false          # Required for JWT authentication — app refuses to start without it
      - key: ALGORITHM
        value: HS256         # JWT algorithm
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      # Both of these must be set together — /auth/forgot-password checks
      # both before touching the DB; if only one is set it still
      # short-circuits (no token created), but better to never deploy with
      # just one configured.
      - key: MAILEROO_API_KEY
        sync: false          # Required for POST /auth/forgot-password to actually send an email
      - key: MAILEROO_FROM_EMAIL
        sync: false          # e.g. noreply@<your-assigned-subdomain>.maileroo.org
      - key: CORS_ORIGINS
        sync: false          # Set to your frontend URL
      
      # File Upload Configuration
      - key: UPLOAD_DIR
        value: /tmp/uploads  # Render free tier has no persistent disk
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      
      # Debug
      - key: SQL_ECHO
        value: "False"       # Set to "True" for SQL query logging
    
    buildFilter:
      paths:
        - apps/api/**
